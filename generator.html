<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор ссылки — первый Бит / медицина</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink:   #E8197A;
  --dark:   #0f1729;
  --mid:    #1a2540;
  --card:   #1e2d4a;
  --border: rgba(255,255,255,.08);
  --text:   #fff;
  --muted:  rgba(255,255,255,.45);
  --green:  #22c55e;
  --radius: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Manrope', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 56px;
}

.container {
  width: 100%;
  max-width: 520px;
}

h1 {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 24px;
  text-align: center;
  background: linear-gradient(135deg, #fff 30%, var(--muted) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.card {
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
}
.form-group:last-child { margin-bottom: 0; }

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  color: #fff;
  outline: none;
  transition: border-color .2s;
}
input:focus {
  border-color: var(--pink);
}

button {
  width: 100%;
  background: var(--pink);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
}
button:active { transform: scale(.98); }

.result-section {
  display: none;
  animation: fadeIn 0.3s ease-out forwards;
}
.result-section.visible { display: block; }

.result-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.url-box {
  background: var(--card);
  border: 1px solid rgba(34,197,94,.2);
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  word-break: break-all;
  margin-bottom: 12px;
  color: #93c5fd;
  font-family: monospace;
}

/* PREVIEW SYSTEM */
.preview-section {
  display: none;
  margin-top: 24px;
  animation: fadeIn 0.3s ease-out forwards;
}
.preview-section.visible { display: block; }

.mgr-card-preview {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.mgr-preview-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mgr-preview-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(145deg, #6B6FD4 0%, #C65CBA 50%, #E8648A 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  color: #fff;
  box-shadow: 0 4px 10px rgba(232,25,122,.2);
}

.mgr-preview-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.mgr-preview-name {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
}

.mgr-preview-role {
  font-size: 13px;
  color: var(--muted);
}

.mgr-preview-contacts {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.mgr-preview-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: rgba(255,255,255,.8);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">
  <h1>Конструктор визитки менеджера</h1>
  
  <div class="card">
    <div class="form-group">
      <label>ФИО Менеджера</label>
      <input type="text" id="f-name" placeholder="Иванов Александр">
    </div>
    
    <div class="form-group">
      <label>Должность</label>
      <input type="text" id="f-role" placeholder="Персональный менеджер">
    </div>
    
    <div class="form-group">
      <label>Телефон</label>
      <input type="text" id="f-phone" placeholder="+7 (999) 123-45-67">
    </div>
    
    <div class="form-group">
      <label>Telegram (Ник или ссылка)</label>
      <input type="text" id="f-tg" placeholder="@alex_bit">
    </div>
    
    <div class="form-group">
      <label>Email</label>
      <input type="text" id="f-email" placeholder="alex@1bit.ru">
    </div>
    
    <div class="form-group" style="margin-top: 24px;">
      <button onclick="generateUrl()">Создать ссылку</button>
    </div>
  </div>

  <div class="card result-section" id="result-section">
    <div class="result-label">Ссылка успешно создана!</div>
    <div class="url-box" id="url-output"></div>
    <button onclick="copyUrl()" style="background:#22c55e;">Копировать ссылку</button>
  </div>

  <div class="preview-section" id="preview-section">
    <label style="margin-bottom:10px;">Предпросмотр блока на визитке:</label>
    <div class="mgr-card-preview">
      <div class="mgr-preview-header">
        <div class="mgr-preview-avatar" id="p-avatar">?</div>
        <div class="mgr-preview-info">
          <div class="mgr-preview-name" id="p-name">Имя не указано</div>
          <div class="mgr-preview-role" id="p-role">Должность</div>
        </div>
      </div>
      <div class="mgr-preview-contacts" id="p-contacts"></div>
    </div>
  </div>
</div>

<script>
function generateUrl() {
  var name  = document.getElementById('f-name').value.trim();
  var role  = document.getElementById('f-role').value.trim();
  var phone = document.getElementById('f-phone').value.trim();
  var tg    = document.getElementById('f-tg').value.trim().replace(/^@/, '');
  var email = document.getElementById('f-email').value.trim();

  if (!name && !phone && !tg && !email) {
    alert('Пожалуйста, заполните хотя бы одно поле.');
    return;
  }

  // Создаем объект данных
  var obj = {
    name: name,
    role: role,
    phone: phone,
    tg: tg,
    email: email
  };

  // Кодируем объект в JSON-строку
  var jsonStr = JSON.stringify(obj);

  // Безопасно кодируем кириллицу (UTF-8) в байтовую строку
  var binaryStr = unescape(encodeURIComponent(jsonStr));

  // Кодируем в стандартный Base64
  var base64 = window.btoa(binaryStr);

  // Превращаем Base64 в безопасный формат для адресной строки URL (URL-Safe)
  var urlSafeBase64 = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  // Формируем чистый путь к файлу index.html
  var currentUrl = window.location.href.split('?')[0];
  var indexUrl = currentUrl.replace(/generator.*\.html$/i, 'index.html');
  
  if (indexUrl === currentUrl) {
    // Резервный случай, если имя файла генератора было кастомным
    indexUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/index.html';
  }

  // Склеиваем финальную ссылку
  var finalUrl = indexUrl + '?p=' + urlSafeBase64;

  // Показываем блок с результатом
  document.getElementById('url-output').textContent = finalUrl;
  document.getElementById('result-section').classList.add('visible');

  // Обновляем интерактивное превью
  updatePreview(name, role, phone, tg, email);
  document.getElementById('preview-section').classList.add('visible');
  
  // Скроллим к результату
  document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
}

function copyUrl() {
  var urlText = document.getElementById('url-output').textContent;
  navigator.clipboard.writeText(urlText).then(function() {
    alert('Ссылка успешно скопирована в буфер обмена!');
  }).catch(function() {
    alert('Не удалось скопировать. Пожалуйста, выделите текст в рамке и скопируйте вручную.');
  });
}

function updatePreview(name, role, phone, tg, email) {
  var initials = name ? name.split(/\s+/).map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase() : '?';
  document.getElementById('p-avatar').textContent = initials;
  document.getElementById('p-name').textContent = name || 'Имя не указано';
  document.getElementById('p-role').textContent = role || 'Должность';

  var pContacts = document.getElementById('p-contacts');
  pContacts.innerHTML = '';

  if (phone) pContacts.innerHTML += '<div class="mgr-preview-row"><span>📞</span><span>' + phone + '</span></div>';
  if (tg)    pContacts.innerHTML += '<div class="mgr-preview-row"><span>✈️</span><span>@' + tg + '</span></div>';
  if (email) pContacts.innerHTML += '<div class="mgr-preview-row"><span>✉️</span><span>' + email + '</span></div>';

  if (!phone && !tg && !email) {
    pContacts.innerHTML = '<div class="mgr-preview-row" style="color:rgba(255,255,255,.3)">Контакты не указаны</div>';
  }
}

// Отслеживание ввода текста для живого превью
['f-name','f-role','f-phone','f-tg','f-email'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', function() {
    var name  = document.getElementById('f-name').value.trim();
    var role  = document.getElementById('f-role').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    var tg    = document.getElementById('f-tg').value.trim().replace(/^@/,'');
    var email = document.getElementById('f-email').value.trim();
    
    if (name || role || phone || tg || email) {
      updatePreview(name, role, phone, tg, email);
      document.getElementById('preview-section').classList.add('visible');
    }
  });
});
</script>

</body>
</html>
