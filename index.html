<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>первый Бит / медицина — наши каналы</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:    #E8192A;
  --pink:   #E8197A;
  --grad-it: linear-gradient(145deg, #6B6FD4 0%, #C65CBA 50%, #E8648A 100%);
  --grad-max: linear-gradient(145deg, #7B52D3 0%, #3B8ECF 50%, #2DBD9A 100%);
  --light: #EFEFEF;
  --white: #FFFFFF;
  --radius: 20px;
  --gap: 14px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Manrope', -apple-system, sans-serif;
  background: #F5F5F7;
  min-height: 100vh;
  color: #1D1D1F;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
}

.wrap {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

/* ── LOGO HEADER ──────────────────────────────────────────── */
.header-logo {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px 0 4px;
}
.header-logo svg {
  height: 32px;
  width: auto;
}

/* ── MANAGER CARD (DYNAMIC) ───────────────────────────────── */
.mgr-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.03);
  display: flex;
  flex-direction: column;
  gap: 16px;
  border: 1px solid rgba(0,0,0,0.03);
}

.mgr-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mgr-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--grad-it);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 20px;
  color: var(--white);
  box-shadow: 0 6px 16px rgba(232,25,122,0.15);
}

.mgr-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.mgr-name {
  font-size: 18px;
  font-weight: 700;
  color: #1D1D1F;
  letter-spacing: -0.3px;
}

.mgr-role {
  font-size: 13px;
  color: #86868B;
  font-weight: 500;
}

.mgr-contacts {
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid #F5F5F7;
  padding-top: 14px;
}

.mgr-row {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: #3A3A3C;
  font-size: 15px;
  font-weight: 600;
  padding: 10px 12px;
  background: #F5F5F7;
  border-radius: 12px;
  transition: background 0.2s, transform 0.1s;
}
.mgr-row:active {
  background: #EFEFEF;
  transform: scale(0.99);
}

.mgr-icon {
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
}

.mgr-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── BLOCK BUTTONS ────────────────────────────────────────── */
.btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--white);
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.btn:active {
  transform: scale(0.98);
}

.btn-it { background: var(--grad-it); }
.btn-max { background: var(--grad-max); }

.btn-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.btn-icon svg {
  width: 26px;
  height: 26px;
  fill: var(--white);
}

.btn-content {
  display: flex;
  flex-direction: column;
  gap: 3px;
  z-index: 2;
}

.btn-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.4px;
}

.btn-desc {
  font-size: 13px;
  opacity: 0.85;
  font-weight: 500;
  line-height: 1.2;
}

/* ── FOOTER ───────────────────────────────────────────────── */
.footer {
  text-align: center;
  font-size: 12px;
  color: #86868B;
  margin-top: 10px;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="wrap">

  <div class="header-logo">
    <svg viewBox="0 0 256 65" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M26.4 49.3H14.1V15.1H26.4C34.1 15.1 38.8 19.3 38.8 26.1C38.8 32.8 33.9 36.9 26.4 36.9H20.3V49.3H26.4ZM20.3 21.3V30.8H26.1C30.1 30.8 32.5 28.9 32.5 26.1C32.5 23.2 30.1 21.3 26.1 21.3H20.3Z" fill="#E8192A"/>
      <path d="M44.4 49.3V15.1H49.9V49.3H44.4Z" fill="#1D1D1F"/>
      <path d="M68.5 27.2C68.5 20.3 73.1 15.1 80.2 15.1C87.3 15.1 91.8 20.2 91.8 27.1V49.3H86.3V27.4C86.3 23.4 83.8 20.4 80.2 20.4C76.5 20.4 74 23.4 74 27.4V49.3H68.5V27.2Z" fill="#1D1D1F"/>
      <path d="M119.8 43.7H104.9V49.3H121.3V54H99.4V15.1H121V19.8H104.9V39H119.8V43.7Z" fill="#1D1D1F"/>
      <path d="M129.4 49.3V15.1H134.9V49.3H129.4Z" fill="#1D1D1F"/>
      <path d="M141.7 49.3V15.1H147.2V44.6H160V49.3H141.7Z" fill="#1D1D1F"/>
      <path d="M174.5 49.3V15.1H188.1C194.8 15.1 198.8 18.6 198.8 24C198.8 28.2 196 31.1 191.7 32C196.4 33 199.4 36.2 199.4 40.7C199.4 46.5 194.7 49.3 187.5 49.3H174.5ZM180 20.1V29.7H187.3C191.3 29.7 193.3 28.1 193.3 25C193.3 21.8 191.3 20.1 187.3 20.1H180ZM180 34.4V44.4H187.3C191.5 44.4 193.8 42.6 193.8 39.4C193.8 36.2 191.5 34.4 187.3 34.4H180Z" fill="#1D1D1F"/>
      <path d="M206.9 49.3V15.1H212.4V49.3H206.9Z" fill="#E8197A"/>
      <path d="M226.5 20.1V49.3H221V20.1H215.1V15.1H232.4V20.1H226.5Z" fill="#1D1D1F"/>
    </svg>
  </div>

  <div class="mgr-card" id="card-mgr" style="display: none;">
    <div class="mgr-header">
      <div class="mgr-avatar" id="mgr-initials">?</div>
      <div class="mgr-info">
        <div class="mgr-name" id="mgr-name"></div>
        <div class="mgr-role" id="mgr-role">Персональный менеджер</div>
      </div>
    </div>
    <div class="mgr-contacts" id="mgr-contacts"></div>
  </div>

  <a href="https://t.me/bitmed" class="btn btn-it" target="_blank">
    <div class="btn-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15.25-2.24 3.66-2.64 4.35-.42.73-.07 1.05.29.98.79-.15 2.32-.48 3.14-.65.62-.13.83.11.53.49-.36.46-3.13 4.01-3.61 4.54-.42.47-.84.28-.7-.27.21-.83.65-2.58.82-3.23.13-.52-.14-.73-.55-.62-.64.17-2.45.66-3.27.87-.58.15-.75-.15-.36-.51.48-.45 3.73-3.64 4.31-4.22.48-.48.9-.3.65.23z"/>
      </svg>
    </div>
    <div class="btn-content">
      <span class="btn-title">Первый Бит / Медицина</span>
      <span class="btn-desc">Канал для главных врачей и управляющих: фишки управления, кейсы автоматизации, ИТ-тренды.</span>
    </div>
  </a>

  <a href="https://t.me/bit_med_max_bot" class="btn btn-max" target="_blank">
    <div class="btn-icon">
      <svg viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
      </svg>
    </div>
    <div class="btn-content">
      <span class="btn-title">БИТ.Управление медицинским центром</span>
      <span class="btn-desc">Официальный бот поддержки нашей МИС. База знаний, релизы, линия консультаций.</span>
    </div>
  </a>

  <div class="footer">
    © Первый Бит. Медицина, 2026
  </div>

</div>

<script>
(function() {
  var pParams = new URLSearchParams(window.location.search);
  var name = '', role = '', phone = '', tg = '', email = '';

  // Извлекаем зашифрованную строку Base64 из параметра 'p'
  var base64Data = pParams.get('p');

  if (base64Data) {
    try {
      // 1. Возвращаем URL-safe символы обратно в классический стандарт Base64
      var normalizedB64 = base64Data.replace(/-/g, '+').replace(/_/g, '/');
      
      // Восстанавливаем недостающие знаки равенства (=) на конце строки
      while (normalizedB64.length % 4) {
        normalizedB64 += '=';
      }

      // 2. Декодируем из Base64 в двоичную строку
      var binaryString = window.atob(normalizedB64);
      
      // 3. Безопасно переводим двоичную строку обратно в UTF-8 (Кириллицу) через decodeURIComponent
      var jsonString = decodeURIComponent(binaryString.split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      // 4. Парсим строку в JS-объект
      var obj = JSON.parse(jsonString);

      name  = obj.name || '';
      role  = obj.role || '';
      phone = obj.phone || '';
      tg    = obj.tg || '';
      email = obj.email || '';
    } catch (e) {
      console.error("Ошибка декодирования персональных данных:", e);
    }
  } else {
    // Резервная обратная совместимость (на случай, если передали прямые параметры name=..&phone=..)
    name  = pParams.get('name') || '';
    role  = pParams.get('role') || '';
    phone = pParams.get('phone') || '';
    tg    = pParams.get('tg') || '';
    email = pParams.get('email') || '';
  }

  // Если абсолютно все поля пусты, карточка менеджера остается скрытой
  if (!name && !phone && !tg && !email) return;

  // Рассчитываем двухбуквенный инициал для аватара
  var initials = name ? name.trim().split(/\s+/).map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase() : '?';

  // Отрисовываем базовую инфу
  document.getElementById('mgr-initials').textContent = initials;
  document.getElementById('mgr-name').textContent = name || 'Персональный менеджер';
  if (role) document.getElementById('mgr-role').textContent = role;

  var contacts = document.getElementById('mgr-contacts');
  contacts.innerHTML = '';

  // Наполняем блок контактов
  if (phone) {
    var clean = phone.replace(/\s/g, '');
    contacts.innerHTML += '<a class="mgr-row" href="tel:' + clean + '"><span class="mgr-icon">📞</span><span class="mgr-text">' + phone + '</span></a>';
  }
  if (tg) {
    var handle = tg.startsWith('@') ? tg : '@' + tg;
    var link   = 'https://t.me/' + handle.replace('@', '');
    contacts.innerHTML += '<a class="mgr-row" href="' + link + '" target="_blank"><span class="mgr-icon">✈️</span><span class="mgr-text">' + handle + '</span></a>';
  }
  if (email) {
    contacts.innerHTML += '<a class="mgr-row" href="mailto:' + email + '"><span class="mgr-icon">✉️</span><span class="mgr-text">' + email + '</span></a>';
  }

  // Делаем карточку видимой
  document.getElementById('card-mgr').style.display = 'flex';
})();
</script>

</body>
</html>
