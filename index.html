<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>первый Бит / медицина — наши каналы</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:    #E8192A;
  --pink:   #E8197A;
  --grad-it: linear-gradient(145deg, #6B6FD4 0%, #C65CBA 50%, #E8648A 100%);
  --grad-max: linear-gradient(145deg, #7B52D3 0%, #3B8ECF 50%, #2DBD9A 100%);
  --grad-yt: linear-gradient(145deg, #FF0000 0%, #D01424 50%, #99000D 100%);
  --grad-manager: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  --light: #EFEFEF;
  --white: #FFFFFF;
  --radius: 20px;
  --gap: 14px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Manrope', -apple-system, sans-serif;
  background: #F5F5F7;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
}

/* ── GRID ────────────────────────────────────────────────── */
.grid {
  width: 100%;
  max-width: 960px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: auto;
  gap: var(--gap);
}

/* intro cell */
.cell-intro {
  grid-column: 1;
  grid-row: 1;
  background: #EBEBEB;
  border-radius: var(--radius);
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 200px;
  animation: fadeUp .5s ease both;
}
.cell-intro .logo-sm {
  height: 22px;
  width: auto;
  flex-shrink: 0;
  display: block;
}
.cell-intro p {
  font-size: 15px;
  font-weight: 700;
  color: #222;
  line-height: 1.4;
  margin-top: 12px;
}

/* ── FLIP CARD ───────────────────────────────────────────── */
.card-wrap {
  perspective: 900px;
  min-height: 200px;
  animation: fadeUp .5s ease both;
}
.card-wrap:nth-child(2) { animation-delay: .05s; }
.card-wrap:nth-child(3) { animation-delay: .10s; }
.card-wrap:nth-child(4) { animation-delay: .15s; }
.card-wrap:nth-child(5) { animation-delay: .20s; }
.card-wrap:nth-child(6) { animation-delay: .08s; }
.card-wrap:nth-child(7) { animation-delay: .13s; }
.card-wrap:nth-child(8) { animation-delay: .18s; }
.card-wrap:nth-child(9) { animation-delay: .23s; }
.card-wrap:nth-child(10) { animation-delay: .28s; }
.card-wrap:nth-child(11) { animation-delay: .33s; }
.card-wrap:nth-child(12) { animation-delay: .38s; }

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.card-back { transform: rotateY(180deg); }

/* ── FRONT FACE ──────────────────────────────────────────── */
.card-front {
  display: flex;
  flex-direction: column;
  padding: 14px;
}

/* plus button */
.btn-plus {
  position: absolute;
  top: 12px; right: 12px;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; line-height: 1;
  cursor: pointer;
  transition: transform .2s, opacity .2s;
  z-index: 2;
  pointer-events: none;
}
.card-wrap:hover .btn-plus { transform: scale(1.15); }

/* QR */
.qr-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 0 8px;
}
.qr-wrap img {
  width: 68%;
  max-width: 130px;
  height: auto;
  display: block;
  border-radius: 8px;
  background: #fff;
  padding: 6px;
}

/* channel name on front */
.ch-name {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 4px;
}

/* ── BACK FACE ───────────────────────────────────────────── */
.card-back {
  display: flex;
  flex-direction: column;
  padding: 14px 14px 12px;
  overflow: hidden;
}
.back-desc {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
}
.back-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 10px;
  flex-shrink: 0;
  gap: 6px;
}
.back-bottom > div {
  min-width: 0;
  flex: 1;
}
.back-name {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
}
.btn-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.25);
  color: inherit;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  pointer-events: none;
  transition: background .2s;
  flex-shrink: 0;
}
.card-wrap:hover .btn-close { background: rgba(255,255,255,.4); }

/* channel link */
.ch-link {
  display: block;
  font-size: 10px;
  font-weight: 700;
  opacity: .8;
  text-decoration: none;
  margin-top: 3px;
  word-break: break-all;
  overflow-wrap: break-word;
  line-height: 1.3;
  transition: opacity .2s;
}
.ch-link:hover { opacity: 1; }

/* ── CARD THEMES ─────────────────────────────────────────── */
.card-bit20 .card-front { background: var(--red); }
.card-bit20 .card-back  { background: var(--red); }
.card-bit20 .btn-plus   { background: rgba(255,255,255,.2); color: #fff; }
.card-bit20 .btn-close  { color: #fff; }
.card-bit20 .ch-name, .card-bit20 .back-name, .card-bit20 .back-desc  { color: #fff; }
.card-bit20 .ch-link    { color: #fff; }

.card-it .card-front { background: var(--grad-it); }
.card-it .card-back  { background: var(--grad-it); }
.card-it .btn-plus   { background: rgba(255,255,255,.25); color: #fff; }
.card-it .btn-close  { color: #fff; }
.card-it .ch-name, .card-it .back-name, .card-it .back-desc  { color: #fff; }
.card-it .ch-link    { color: rgba(255,255,255,.9); }

.card-rt .card-front { background: var(--light); }
.card-rt .card-back  { background: var(--light); }
.card-rt .btn-plus   { background: rgba(120,80,200,.15); color: #7B52D3; }
.card-rt .btn-close  { background: rgba(0,0,0,.1); color: #333; }
.card-rt .ch-name, .card-rt .back-name  { color: #222; }
.card-rt .back-desc  { color: #333; }
.card-rt .ch-link    { color: #555; }

.card-1c .card-front { background: var(--red); }
.card-1c .card-back  { background: var(--red); }
.card-1c .btn-plus   { background: rgba(255,255,255,.2); color: #fff; }
.card-1c .btn-close  { color: #fff; }
.card-1c .ch-name, .card-1c .back-name, .card-1c .back-desc  { color: #fff; }
.card-1c .ch-link    { color: rgba(255,255,255,.85); }

.card-dzen .card-front { background: var(--light); }
.card-dzen .card-back  { background: var(--light); }
.card-dzen .btn-plus   { background: rgba(232,25,122,.15); color: var(--pink); }
.card-dzen .btn-close  { background: rgba(0,0,0,.1); color: #333; }
.card-dzen .ch-name, .card-dzen .back-name  { color: #222; }
.card-dzen .back-desc  { color: #333; }
.card-dzen .ch-link    { color: #555; }

.card-max .card-front { background: var(--grad-max); }
.card-max .card-back  { background: var(--grad-max); }
.card-max .btn-plus   { background: rgba(255,255,255,.25); color: #fff; }
.card-max .btn-close  { color: #fff; }
.card-max .ch-name, .card-max .back-name, .card-max .back-desc  { color: #fff; }
.card-max .ch-link    { color: rgba(255,255,255,.9); }
