<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>первый Бит / медицина — наши каналы</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #E8192A;
  --pink: #E8197A;
  --grad-it: linear-gradient(145deg, #6B6FD4 0%, #C65CBA 50%, #E8648A 100%);
  --grad-max: linear-gradient(145deg, #7B52D3 0%, #3B8ECF 50%, #2DBD9A 100%);
  --light: #EFEFEF;
  --white: #FFFFFF;
  --radius: 20px;
  --gap: 14px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Manrope', -apple-system, sans-serif;
  background: #F5F5F7;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 40px;
}

/* ── GRID ────────────────────────────────────────────────── */
.grid {
  width: 100%;
  max-width: 960px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: minmax(200px, auto);
  gap: var(--gap);
}

@media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }

/* intro cell */
.cell-intro {
  background: #EBEBEB;
  border-radius: var(--radius);
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 200px;
  animation: fadeUp .5s ease both;
}
.cell-intro .logo-sm {
  font-weight: 800;
  color: var(--red);
  font-size: 18px;
}
.cell-intro p {
  font-size: 15px;
  font-weight: 700;
  color: #222;
  line-height: 1.4;
  margin-top: 12px;
}

/* ── FLIP CARD ───────────────────────────────────────────── */
.card-wrap {
  perspective: 900px;
  min-height: 200px;
  animation: fadeUp .5s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.card-back { transform: rotateY(180deg); }

/* ── FRONT FACE ──────────────────────────────────────────── */
.card-front {
  display: flex;
  flex-direction: column;
  padding: 14px;
}

/* plus button */
.btn-plus {
  position: absolute;
  top: 12px; right: 12px;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; line-height: 1;
  cursor: pointer;
  transition: transform .2s, opacity .2s;
  z-index: 2;
  pointer-events: none;
}
.card-wrap:hover .btn-plus { transform: scale(1.15); }

/* QR */
.qr-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 0 8px;
}
.qr-wrap img {
  width: 68%;
  max-width: 130px;
  height: auto;
  display: block;
  border-radius: 8px;
  background: #fff;
  padding: 6px;
}

.ch-name {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 4px;
}

/* ── BACK FACE ───────────────────────────────────────────── */
.card-back {
  display: flex;
  flex-direction: column;
  padding: 14px 14px 12px;
  overflow: hidden;
  transition: filter .15s;
}
.card-back:hover { filter: brightness(1.07); }

.back-desc {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
}
.back-bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: 10px;
  flex-shrink: 0;
  gap: 6px;
}
.back-bottom > div {
  min-width: 0;
  flex: 1;
}
.back-name {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
}
.btn-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.25);
  color: inherit;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .2s;
  flex-shrink: 0;
}
.card-wrap:hover .btn-close { background: rgba(255,255,255,.4); }

.ch-link {
  display: block;
  font-size: 10px;
  font-weight: 700;
  opacity: .8;
  text-decoration: none;
  margin-top: 3px;
  word-break: break-all;
  overflow-wrap: break-word;
  line-height: 1.3;
  transition: opacity .2s;
}
.ch-link:hover { opacity: 1; }

.tap-hint {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  font-size: 9.5px;
  font-weight: 600;
  opacity: .45;
  letter-spacing: .3px;
}

/* Стили для ссылок внутри блока контактов менеджера */
.mgr-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 13px;
  margin-bottom: 6px;
}
.mgr-initials-circle {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 10px;
}

/* ── CARD THEMES ─────────────────────────────────────────── */
.card-bit20 .card-front, .card-bit20 .card-back { background: var(--red); color: #fff; }
.card-bit20 .btn-plus { background: rgba(255,255,255,.2); color: #fff; }
.card-bit20 .ch-link { color: #fff; }

.card-it .card-front, .card-it .card-back { background: var(--grad-it); color: #fff; }
.card-it .btn-plus { background: rgba(255,255,255,.25); color: #fff; }
.card-it .ch-link { color: rgba(255,255,255,.9); }

.card-rt .card-front, .card-rt .card-back { background: var(--light); color: #222; }
.card-rt .btn-plus { background: rgba(120,80,200,.15); color: #7B52D3; }
.card-rt .btn-close { background: rgba(0,0,0,.1); color: #333; }
.card-rt .ch-link { color: #555; }

.card-dzen .card-front, .card-dzen .card-back { background: var(--light); color: #222; }
.card-dzen .btn-plus { background: rgba(232,25,122,.15); color: var(--pink); }
.card-dzen .btn-close { background: rgba(0,0,0,.1); color: #333; }
.card-dzen .ch-link { color: #555; }

/* Тема Личного менеджера (Использует градиент IT или любой другой) */
.card-manager .card-front, .card-manager .card-back { background: var(--grad-it); color: #fff; }
.card-manager .btn-plus { background: rgba(255,255,255,.25); color: #fff; }
</style>
</head>
<body>

<div class="grid">
  
  <div class="cell-intro">
    <div class="logo-sm">Первый Бит</div>
    <p>Медицинские ИТ-решения для вашего бизнеса</p>
  </div>

  <div class="card-wrap card-manager" id="manager-card" style="display: none;">
    <div class="card-inner">
      <div class="card-front">
        <button class="btn-plus">+</button>
        <div class="mgr-initials-circle" id="mgr-initials">?</div>
        <div class="ch-name" id="mgr-name">Ваш менеджер</div>
        <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;" id="mgr-role">Персональный менеджер</div>
      </div>
      <div class="card-back">
        <div class="back-desc" id="mgr-contacts">
          </div>
        <div class="back-bottom">
          <div>
            <div class="back-name">Контакты</div>
          </div>
          <button class="btn-close">×</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card-wrap card-bit20">
    <div class="card-inner">
      <div class="card-front">
        <button class="btn-plus">+</button>
        <div class="qr-wrap"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="QR"></div>
        <div class="ch-name">БИТ.Медицина</div>
      </div>
      <div class="card-back">
        <div class="back-desc">Наш основной Telegram-канал об автоматизации здравоохранения.</div>
        <div class="back-bottom">
          <div>
            <div class="back-name">БИТ.Медицина</div>
            <a href="https://t.me/bit_med" class="ch-link" target="_blank">t.me/bit_med</a>
          </div>
          <button class="btn-close">×</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// 1. ЛОГИКА ДЕКОДИРОВАНИЯ BASE64 (ДЛЯ ВАШЕГО МЕНЕДЖЕРА)
(function() {
  var pParams = new URLSearchParams(window.location.search);
  var base64Data = pParams.get('p');

  if (base64Data) {
    try {
      // Приводим URL-safe Base64 к стандартному виду
      var normalizedB64 = base64Data.replace(/-/g, '+').replace(/_/g, '/');
      var binaryString = window.atob(normalizedB64);
      var bytes = new Uint8Array(binaryString.length);
      for (var i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      
      // Декодируем байты в UTF-8 JSON строку
      var jsonString = new TextDecoder().decode(bytes);
      var obj = JSON.parse(jsonString);

      var name  = obj.name || '';
      var role  = obj.role || '';
      var phone = obj.phone || '';
      var tg    = obj.tg || '';
      var email = obj.email || '';

      if (name || phone || tg || email) {
        // Показываем карточку менеджера в сетке
        document.getElementById('manager-card').style.display = 'block';
        
        // Генерируем инициалы
        var initials = name ? name.trim().split(/\s+/).map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase() : '?';
        document.getElementById('mgr-initials').textContent = initials;
        
        if (name) document.getElementById('mgr-name').textContent = name;
        if (role) document.getElementById('mgr-role').textContent = role;

        // Рендерим контакты на задней стороне
        var contactsContainer = document.getElementById('mgr-contacts');
        contactsContainer.innerHTML = '';

        if (phone) {
          var cleanPhone = phone.replace(/\s/g, '');
          contactsContainer.innerHTML += '<a class="mgr-row" href="tel:' + cleanPhone + '"><span>📞</span> ' + phone + '</a>';
        }
        if (tg) {
          var handle = tg.startsWith('@') ? tg : '@' + tg;
          var link = 'https://t.me/' + handle.replace('@', '');
          contactsContainer.innerHTML += '<a class="mgr-row" href="' + link + '" target="_blank"><span>✈️</span> ' + handle + '</a>';
        }
        if (email) {
          contactsContainer.innerHTML += '<a class="mgr-row" href="mailto:' + email + '"><span>✉️</span> ' + email + '</a>';
        }
      }
    } catch (e) {
      console.error("Ошибка обработки Base64 параметров:", e);
    }
  }
})();

// 2. ЛОГИКА ПЕРЕВОРОТА КАРТОЧЕК ПО КЛИКУ
document.querySelectorAll('.card-wrap').forEach(function(card) {
  card.addEventListener('click', function(e) {
    // Если кликнули по ссылке, не переворачиваем карту обратно сразу
    if (e.target.tagName === 'A') return;
    
    this.classList.toggle('flipped');
  });
});
</script>

</body>
</html>
