<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Первый БИТ / Медицина — Центр знаний</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e6097f;
    --pink-soft:#fce6f1;
    --pink-soft2:#fdf2f8;
    --ink:#15151f;
    --ink-2:#3a3a47;
    --muted:#7a7a88;
    --line:#ececf1;
    --card:#f6f6f9;
    --bg:#ffffff;
    --radius:16px;
    --shadow:0 8px 30px rgba(20,20,40,.08);
    --shadow-lg:0 24px 60px rgba(20,20,40,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    background:#eef0f4;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1060px;margin:0 auto;background:var(--bg);}
  .wrap{padding:0 28px}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}

  /* ---------- HEADER ---------- */
  header{
    display:flex;align-items:center;gap:22px;
    padding:22px 28px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);z-index:60;
  }
  .logo{font-weight:800;font-size:21px;letter-spacing:-.5px;white-space:nowrap}
  .logo .slash{color:#cfcfd8;font-weight:500;margin:0 4px}
  .logo .med{color:var(--pink)}
  .logo-sub{font-size:12.5px;color:var(--muted);line-height:1.25;border-left:1px solid var(--line);padding-left:18px}
  .ask{
    margin-left:auto;border:1.5px solid var(--pink);color:var(--pink);
    background:#fff;border-radius:40px;padding:11px 20px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:9px;cursor:pointer;transition:.25s;white-space:nowrap;
  }
  .ask:hover{background:var(--pink);color:#fff;transform:translateY(-1px);box-shadow:0 8px 22px rgba(230,9,127,.3)}
  .ask svg{width:17px;height:17px}

  /* ---------- HERO ---------- */
  .hero{
    margin:22px 28px;border:1px solid var(--line);border-radius:22px;overflow:hidden;
    background:
      radial-gradient(120% 120% at 100% 0%, #fde9f3 0%, rgba(253,233,243,0) 55%),
      linear-gradient(180deg,#ffffff,#fafafd);
    position:relative;
  }
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;align-items:center}
  .hero-text{padding:54px 0 54px 44px}
  .hero h1{font-size:42px;line-height:1.08;letter-spacing:-1.2px;font-weight:800;margin-bottom:18px}
  .hero h1 .l2{color:var(--ink)}
  .hero p.lede{font-size:16px;color:var(--ink-2);max-width:430px;margin-bottom:34px}
  .stats{display:flex;gap:34px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;gap:6px}
  .stat .ic{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--pink);box-shadow:var(--shadow)}
  .stat .ic svg{width:21px;height:21px}
  .stat .big{font-size:21px;font-weight:800;margin-top:4px}
  .stat .lbl{font-size:12.5px;color:var(--muted)}
  .hero-art{position:relative;height:100%;min-height:330px}
  .hero-art .scene{
    position:absolute;inset:0;display:grid;place-items:center;
  }
  /* floating medical chips */
  .chip{position:absolute;border-radius:14px;display:grid;place-items:center;
    background:#fff;box-shadow:var(--shadow);color:var(--pink);border:1px solid var(--line);
    animation:float 6s ease-in-out infinite}
  .chip svg{width:50%;height:50%}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* ---------- LAYOUT ---------- */
  .layout{display:grid;grid-template-columns:1fr 320px;gap:30px;padding:8px 28px 40px}
  .digest-h{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:17px;font-weight:700;color:var(--ink-2)}
  .digest-h svg{width:19px;height:19px;color:var(--pink)}

  .sec-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:30px 0 16px}
  .sec-title .tag{width:30px;height:30px;border-radius:9px;background:var(--pink-soft);display:grid;place-items:center;color:var(--pink)}
  .sec-title .tag svg{width:17px;height:17px}

  .cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  /* generic card */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:#e3c7da}
  .card:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

  .thumb{height:118px;position:relative;display:grid;place-items:center;overflow:hidden}
  .thumb .zoom{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--ink-2);
    box-shadow:var(--shadow);transition:.25s}
  .card:hover .zoom{background:var(--pink);color:#fff;transform:scale(1.08)}
  .thumb .zoom svg{width:15px;height:15px}
  .pattern{position:absolute;inset:0;opacity:.9}

  .card-body{padding:15px 16px 17px;display:flex;flex-direction:column;flex:1}
  .card-body h3{font-size:15px;font-weight:700;line-height:1.25;margin-bottom:8px}
  .card-body p{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:14px;flex:1}
  .more{color:var(--pink);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;margin-top:auto}
  .more svg{width:14px;height:14px;transition:transform .25s}
  .card:hover .more svg{transform:translateX(4px)}

  /* news card (no thumb) */
  .news-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px 17px;
    cursor:pointer;transition:.28s;display:flex;flex-direction:column}
  .news-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:#e3c7da}
  .news-card .date{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
  .news-card h3{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:14px;flex:1}

  /* events */
  .event-card{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 16px;cursor:pointer;transition:.28s}
  .event-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:#e3c7da}
  .ev-date{text-align:center;flex-shrink:0}
  .ev-date .d{font-size:24px;font-weight:800;color:var(--pink);line-height:1}
  .ev-date .m{font-size:11.5px;color:var(--muted);font-weight:600}
  .ev-info .kind{font-size:10.5px;letter-spacing:1px;color:var(--pink);font-weight:800;margin-bottom:6px}
  .ev-info h3{font-size:13.5px;font-weight:700;line-height:1.3;margin-bottom:8px}
  .ev-time{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .ev-time svg{width:13px;height:13px}

  /* video */
  .video-card{border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid var(--line);
    background:#fff;transition:.28s;display:flex;flex-direction:column}
  .video-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
  .video-thumb{height:118px;position:relative;display:grid;place-items:center}
  .video-thumb .play{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);
    display:grid;place-items:center;color:var(--pink);box-shadow:var(--shadow);transition:.25s;z-index:2}
  .video-card:hover .play{transform:scale(1.12);background:var(--pink);color:#fff}
  .video-thumb .play svg{width:18px;height:18px;margin-left:2px}
  .video-thumb .dur{position:absolute;right:9px;top:9px;background:rgba(15,15,25,.78);color:#fff;
    font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;z-index:2}
  .video-card .vb{padding:13px 15px 15px}
  .video-card h3{font-size:13.5px;font-weight:700;line-height:1.3}

  /* ---------- SIDEBAR ---------- */
  aside{display:flex;flex-direction:column;gap:24px}
  .side-block{background:#fff}
  .side-h{font-size:18px;font-weight:800;line-height:1.25;margin-bottom:8px}
  .side-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
  .channels{display:flex;flex-direction:column;gap:10px}
  .channel{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);
    border-radius:14px;cursor:pointer;transition:.25s;background:#fff}
  .channel:hover{border-color:var(--pink);box-shadow:0 8px 22px rgba(230,9,127,.12);transform:translateX(3px)}
  .channel .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;color:#fff}
  .channel .ci svg{width:20px;height:20px}
  .channel .ct{flex:1}
  .channel .ct .n{font-size:14.5px;font-weight:700}
  .channel .ct .d{font-size:12px;color:var(--muted);line-height:1.25}
  .channel .arr{color:#c7c7d2;transition:.25s}
  .channel:hover .arr{color:var(--pink);transform:translateX(3px)}
  .channel .arr svg{width:16px;height:16px}

  .guide{background:linear-gradient(160deg,#fdf2f8,#fbe6f1);border:1px solid #f5d2e6;border-radius:18px;padding:22px}
  .guide .gh{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .guide .gh .gi{width:38px;height:38px;border-radius:11px;background:var(--pink);display:grid;place-items:center;color:#fff}
  .guide .gh .gi svg{width:20px;height:20px}
  .guide .gh h3{font-size:16px;font-weight:800}
  .guide p{font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
  .guide-btn{width:100%;background:#fff;color:var(--pink);border:1.5px solid var(--pink);border-radius:40px;
    padding:12px;font-weight:700;font-size:14px;cursor:pointer;transition:.25s;display:inline-flex;
    align-items:center;justify-content:center;gap:7px}
  .guide-btn:hover{background:var(--pink);color:#fff;box-shadow:0 8px 22px rgba(230,9,127,.3)}
  .guide-btn svg{width:15px;height:15px}

  .useful{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
  .useful h3{font-size:16px;font-weight:800;margin-bottom:16px}
  .useful li{list-style:none;display:flex;gap:11px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin-bottom:13px}
  .useful li:last-child{margin-bottom:0}
  .useful li .dot{width:18px;height:18px;border-radius:50%;background:var(--pink-soft);color:var(--pink);
    display:grid;place-items:center;flex-shrink:0;margin-top:1px}
  .useful li .dot svg{width:11px;height:11px}

  /* ---------- CTA STRIP ---------- */
  .strip{margin:8px 28px 30px;background:linear-gradient(120deg,#fdf2f8,#fbe7f1);border:1px solid #f5d2e6;
    border-radius:20px;padding:26px 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .strip .si{width:54px;height:54px;border-radius:15px;background:#fff;display:grid;place-items:center;
    color:var(--pink);box-shadow:var(--shadow);flex-shrink:0}
  .strip .si svg{width:26px;height:26px}
  .strip .st{flex:1;min-width:280px}
  .strip .st h3{font-size:17px;font-weight:800;margin-bottom:5px}
  .strip .st p{font-size:13.5px;color:var(--ink-2)}
  .strip .mailto{display:flex;align-items:center;gap:13px}
  .strip .mailto .mi{width:46px;height:46px;border-radius:13px;background:var(--pink);display:grid;place-items:center;color:#fff}
  .strip .mailto .mi svg{width:21px;height:21px}
  .strip .mailto .mt .l{font-size:12px;color:var(--muted)}
  .strip .mailto .mt a{font-size:15px;font-weight:700;color:var(--pink)}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line);padding:26px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  footer .flinks{display:flex;gap:26px;font-size:13px;color:var(--muted)}
  footer .flinks a:hover{color:var(--pink)}
  footer .social{margin-left:auto;display:flex;align-items:center;gap:12px}
  footer .social .lbl{font-size:12px;color:var(--muted)}
  footer .social .sbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--ink-2);cursor:pointer;transition:.25s}
  footer .social .sbtn:hover{background:var(--pink);color:#fff;border-color:var(--pink);transform:translateY(-2px)}
  footer .social .sbtn svg{width:16px;height:16px}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(18,18,30,.55);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;
    transition:opacity .28s;z-index:100}
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
    transform:translateY(24px) scale(.97);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  .overlay.open .modal{transform:translateY(0) scale(1)}
  .modal-head{height:140px;display:grid;place-items:center;position:relative;border-radius:20px 20px 0 0}
  .modal-head .badge{position:absolute;left:22px;top:18px;background:rgba(255,255,255,.92);color:var(--pink);
    font-size:11px;font-weight:800;letter-spacing:.6px;padding:6px 12px;border-radius:30px}
  .modal-close{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.92);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:.2s}
  .modal-close:hover{background:var(--pink);color:#fff;transform:rotate(90deg)}
  .modal-close svg{width:18px;height:18px}
  .modal-body{padding:26px 28px 30px}
  .modal-body .eyebrow{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--pink);margin-bottom:8px;text-transform:uppercase}
  .modal-body h2{font-size:23px;font-weight:800;line-height:1.15;letter-spacing:-.5px;margin-bottom:16px}
  .modal-body p{font-size:14.5px;color:var(--ink-2);margin-bottom:14px;line-height:1.6}
  .modal-body ul{margin:0 0 18px 18px}
  .modal-body li{font-size:14px;color:var(--ink-2);margin-bottom:8px}
  .modal-meta{display:flex;gap:18px;flex-wrap:wrap;padding:14px 0 18px;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);margin:18px 0}
  .modal-meta .mm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .modal-meta .mm svg{width:15px;height:15px;color:var(--pink)}
  .modal-cta{display:inline-flex;align-items:center;gap:9px;background:var(--pink);color:#fff;border:none;
    border-radius:40px;padding:13px 26px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.25s;
    font-family:inherit;margin-top:6px}
  .modal-cta:hover{box-shadow:0 12px 28px rgba(230,9,127,.35);transform:translateY(-2px)}
  .modal-cta svg{width:16px;height:16px}

  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}

  /* toast */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);
    color:#fff;padding:13px 22px;border-radius:40px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
    transition:.35s;z-index:120;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:17px;height:17px;color:#5ee6a8}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:920px){
    .layout{grid-template-columns:1fr}
    .hero-grid{grid-template-columns:1fr}
    .hero-art{min-height:240px;order:-1}
    .hero-text{padding:36px 28px}
    .hero h1{font-size:34px}
  }
  @media(max-width:680px){
    .wrap,.hero-text{padding-left:20px;padding-right:20px}
    header{padding:16px 20px;gap:14px}
    .logo-sub{display:none}
    .hero,.strip{margin-left:16px;margin-right:16px}
    .layout{padding:8px 16px 30px}
    .cards-3{grid-template-columns:1fr}
    .stats{gap:20px}
    .hero h1{font-size:28px}
    .strip{flex-direction:column;align-items:flex-start}
    footer{flex-direction:column;align-items:flex-start}
    footer .social{margin-left:0}
    .ask span{display:none}
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header>
    <div class="logo" id="logo"></div>
    <div class="logo-sub" id="headerSub"></div>
    <button class="ask" onclick="openHelp()">
      <span id="askBtn"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </button>
  </header>

  <!-- HERO -->
  <section class="hero reveal">
    <div class="hero-grid">
      <div class="hero-text">
        <h1 id="heroTitle"></h1>
        <p class="lede" id="heroLede"></p>
        <div class="stats" id="heroStats"></div>
      </div>
      <div class="hero-art" id="heroArt"></div>
    </div>
  </section>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- MAIN COLUMN -->
    <main>
      <div class="digest-h reveal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="digestTitle">Дайджест за июль 2026</span>
      </div>

      <!-- КЕЙСЫ -->
      <div class="sec-title reveal">
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>
        <span id="secCases">Кейсы внедрения</span>
      </div>
      <div class="cards-3" id="cases"></div>

      <!-- СТАТЬИ -->
      <div class="sec-title reveal">
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></span>
        <span id="secArticles">Статьи</span>
      </div>
      <div class="cards-3" id="articles"></div>

      <!-- НОВОСТИ -->
      <div class="sec-title reveal">
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg></span>
        <span id="secNews">Новости</span>
      </div>
      <div class="cards-3" id="news"></div>

      <!-- МЕРОПРИЯТИЯ -->
      <div class="sec-title reveal">
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <span id="secEvents">Мероприятия</span>
      </div>
      <div class="cards-3" id="events"></div>

      <!-- ВИДЕО -->
      <div class="sec-title reveal">
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
        <span id="secVideos">Видео</span>
      </div>
      <div class="cards-3" id="videos"></div>
    </main>

    <!-- SIDEBAR -->
    <aside>
      <div class="side-block reveal">
        <div class="side-h" id="channelsTitle"></div>
        <div class="side-sub" id="channelsSub"></div>
        <div class="channels" id="channels"></div>
      </div>

      <div class="guide reveal">
        <div class="gh">

/* логотип «первыйБИТ / медицина» */

/* открыть ссылку, если она задана; иначе показать уведомление */

}

/* встроенная иллюстрация для hero, если не задана картинка */
const heroIllustration=`<div class="scene">

</div>`;

/* ---------------- ПОДСТАНОВКА ТЕКСТОВ ИЗ SITE ---------------- */
function setHTML(id,html){const el=document.getElementById(id);if(el)el.innerHTML=html;}
function applySite(){
  // шапка
  setHTML('logo',logoHtml());
  setHTML('footerLogo',logoHtml());
  setHTML('headerSub',SITE.headerSub);
  setHTML('askBtn',SITE.askBtn);
  // hero
  setHTML('heroTitle',`${SITE.heroTitle1}<br><span class="l2">${SITE.heroTitle2}</span>`);
  setHTML('heroLede',SITE.heroLede);
  setHTML('heroStats',SITE.heroStats.map(s=>`
    <div class="stat"><div class="ic">${statIcon(s.icon)}</div>
    <div class="big">${s.big}</div><div class="lbl">${s.lbl}</div></div>`).join(''));
  setHTML('heroArt', (SITE.heroImage&&SITE.heroImage.trim())
    ? `<img src="${SITE.heroImage}" alt="" style="width:100%;height:100%;object-fit:contain">`
    : heroIllustration);

  // подвал

  setHTML('socialIcons',SITE.social.map((s,i)=>
    `<div class="sbtn" onclick="go(SITE.social[${i}].link,'Переход: ${s.name}')"><svg viewBox="0 0 24 24" fill="currentColor">${SOCIAL_ICONS[s.icon]||''}</svg></div>`).join(''));
}

/* ---------------- RENDER ---------------- */
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
const zoomIc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';

function thumbPattern(g,img){
  const bg = (img&&img.trim())
    ? `<img src="${img}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`
    : `<svg width="100%" height="100%" viewBox="0 0 200 120" preserveAspectRatio="none" style="position:absolute;inset:0;opacity:.35">
        <path d="M0 70 Q40 50 80 70 T160 70 T240 70" stroke="#fff" stroke-width="3" fill="none"/>
        <path d="M0 90 Q40 75 80 90 T160 90 T240 90" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>
        <circle cx="150" cy="40" r="22" stroke="#fff" stroke-width="2" fill="none" opacity=".5"/>
      </svg>`;
  return `<div class="thumb" style="${grad(g[0],g[1])}">${bg}<div class="zoom">${zoomIc}</div></div>`;
}

function renderCases(){
  document.getElementById('cases').innerHTML = cases.map((c,i)=>`
    <article class="card reveal" tabindex="0" onclick="openModal('case',${i})" onkeypress="if(event.key==='Enter')openModal('case',${i})">
      ${thumbPattern(c.g,c.img)}
      <div class="card-body">
        <h3>${c.t}</h3><p>${c.d}</p>
        <span class="more">Читать кейс ${arrow}</span>
      </div></article>`).join('');
}
function renderArticles(){
  document.getElementById('articles').innerHTML = articles.map((a,i)=>`
    <article class="card reveal" tabindex="0" onclick="openModal('article',${i})" onkeypress="if(event.key==='Enter')openModal('article',${i})">
      ${thumbPattern(a.g,a.img)}
      <div class="card-body">
        <h3>${a.t}</h3><p>${a.d}</p>
        <span class="more">Читать статью ${arrow}</span>
      </div></article>`).join('');
}
function renderNews(){
  document.getElementById('news').innerHTML = news.map((n,i)=>`

      <div class="date">${n.date}</div>
      <h3>${n.t}</h3>
      <span class="more">Читать новость ${arrow}</span>

}
function renderEvents(){
  document.getElementById('events').innerHTML = events.map((e,i)=>`
    <article class="event-card reveal" tabindex="0" onclick="openModal('event',${i})" onkeypress="if(event.key==='Enter')openModal('event',${i})">
      <div class="ev-date"><div class="d">${e.d}</div><div class="m">${e.m}</div></div>

      </div></article>`).join('');
}
function renderVideos(){
  document.getElementById('videos').innerHTML = videos.map((v,i)=>`
    <article class="video-card reveal" tabindex="0" onclick="openModal('video',${i})" onkeypress="if(event.key==='Enter')openModal('video',${i})">
      <div class="video-thumb" style="${grad(v.g[0],v.g[1])}">
        ${(v.img&&v.img.trim())?`<img src="${v.img}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:''}

function renderChannels(){
  document.getElementById('channels').innerHTML = channels.map((ch,i)=>`

applySite();
renderCases();renderArticles();renderNews();renderEvents();renderVideos();renderChannels();renderUseful();

/* ---------------- MODAL ---------------- */
const overlay=document.getElementById('overlay');
const mBody=document.getElementById('mBody');
const mBadge=document.getElementById('mBadge');
const mHead=document.getElementById('mHead');

const headStyles={
  case:'linear-gradient(135deg,#fce6f1,#f7c9e1)',
  article:'linear-gradient(135deg,#e7eef6,#d3def0)',
  news:'linear-gradient(135deg,#fdf2f8,#fbe7f1)',
  event:'linear-gradient(135deg,#e6097f,#ff5bb0)',
  video:'linear-gradient(135deg,#1b2330,#39465c)'
};
const badges={case:'КЕЙС',article:'СТАТЬЯ',news:'НОВОСТЬ',event:'МЕРОПРИЯТИЕ',video:'ВИДЕО'};
const sources={case:cases,article:articles,news:news,event:events,video:videos};

function openModal(type,i){
  const item=sources[type][i];
  mBadge.textContent=badges[type];
  mHead.style.background=headStyles[type];
  const isLight=(type==='event'||type==='video');
  mBadge.style.color=isLight?'#e6097f':'#e6097f';

  let metaHtml='';
  if(item.meta){metaHtml='<div class="modal-meta">'+item.meta.map(m=>`<span class="mm"><span style="font-size:15px">${m[0]}</span>${m[1]}</span>`).join('')+'</div>';}
  const ctaLabel=item.cta||(type==='video'?'Смотреть видео':'Перейти к материалу');
  const safeTitle=(item.t).replace(/'/g,'');
  const ctaAction = (item.link&&item.link.trim())
      ? `window.open('${item.link}','_blank');closeModal()`
      : `toast('Открываем: ${safeTitle}');closeModal()`;

  mBody.innerHTML=`
    <div class="eyebrow">${item.eyebrow}</div>
    <h2>${item.t}</h2>
    ${item.body}
    ${metaHtml}
    <button class="modal-cta" onclick="${ctaAction}">
      ${ctaLabel}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>`;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){overlay.classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function openHelp(){
  mBadge.textContent='ПОДДЕРЖКА';mBadge.style.color='#e6097f';mHead.style.background=headStyles.news;
  mBody.innerHTML=`
    <div class="eyebrow">${SITE.askBtn}</div>
    <h2>${SITE.helpTitle}</h2>
    <p>${SITE.helpText}</p>
    <div class="modal-meta"><span class="mm"><span style="font-size:15px">✉</span>${SITE.helpEmail}</span><span class="mm"><span style="font-size:15px">⏱</span>${SITE.helpNote}</span></div>
    <button class="modal-cta" onclick="location.href='mailto:${SITE.helpEmail}'">${SITE.helpBtn}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>`;
  overlay.classList.add('open');document.body.style.overflow='hidden';
}
function openGuide(){
  mBadge.textContent='РУКОВОДСТВА';mBadge.style.color='#e6097f';mHead.style.background=headStyles.case;
  const action=(SITE.guideLink&&SITE.guideLink.trim())
    ? `window.open('${SITE.guideLink}','_blank');closeModal()`
    : `toast('Открываем руководство пользователя');closeModal()`;
  mBody.innerHTML=`
    <div class="eyebrow">${SITE.guideTitle}</div>
    <h2>${SITE.guideModalTitle}</h2>
    <p>${SITE.guideModalText}</p>
    <ul>${SITE.guideModalList.map(x=>`<li>${x}</li>`).join('')}</ul>
    <button class="modal-cta" onclick="${action}">${SITE.guideBtn}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>`;
  overlay.classList.add('open');document.body.style.overflow='hidden';
}
function goChannel(i){
  if(channels[i].n==='Telegram'){openTelegram();return;}
  go(channels[i].link,'Переход в канал: '+channels[i].n);
}

function openTelegram(){
  mBadge.textContent='TELEGRAM';
  mBadge.style.color='#2aabee';
  mHead.style.background='linear-gradient(135deg,#d3eefb,#a9dcf6)';
  const list = tgChannels.map((c,i)=>`
    <div class="channel" style="margin-bottom:10px" onclick="go(tgChannels[${i}].link,'Переход в канал: ${c.n.replace(/'/g,'')}');closeModal()">
      <div class="ci" style="background:#2aabee"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-.9.5l.3-4.7 8.5-7.7c.4-.3-.1-.5-.6-.2L6.7 13 2 11.5c-1-.3-1-1 .2-1.5l18.5-7.1c.8-.3 1.5.2 1.2 1.4z"/></svg></div>
      <div class="ct"><div class="n">${c.n}</div><div class="d">${c.d}</div></div>
      <div class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>`).join('');
  mBody.innerHTML=`
    <div class="eyebrow">Telegram · 3 канала для разных задач</div>
    <h2>Выберите канал</h2>
    <p>Подпишитесь на канал, который подходит под ваши задачи:</p>
    <div style="margin-top:6px">${list}</div>`;
  overlay.classList.add('open');document.body.style.overflow='hidden';
}

/* ---------------- TOAST ---------------- */
let toastTimer;
function toast(text){
  document.getElementById('toastText').textContent=text;
  const t=document.getElementById('toast');t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------------- REVEAL ON SCROLL ---------------- */
const io=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
